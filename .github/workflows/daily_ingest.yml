name: Daily YouTube Ingestion

on:
  schedule:
    # Runs daily at 00:00 UTC (runs automatically in the cloud, laptop can be OFF)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to click "Run workflow" manually from GitHub anytime
  push:
    branches:
      - main
    paths-ignore:
      - 'notes/**'
      - 'json/**'
      - 'index.json'
      - 'processed_videos.json'
      - 'logs/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Cookies (if provided)
        shell: bash
        run: |
          python -c '
          import os, re
          raw = os.getenv("YOUTUBE_COOKIES", "").strip()
          if raw:
              cleaned = []
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("#"):
                      cleaned.append(line)
                  else:
                      parts = re.split(r"\s+", line)
                      if len(parts) >= 7:
                          cleaned.append("\t".join(parts[:7]))
                      else:
                          cleaned.append(line)
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(cleaned) + "\n")
              print(f"cookies.txt restored and formatted ({len(cleaned)} lines).")
          else:
              print("No YOUTUBE_COOKIES secret found. Proceeding with playlist ingestion.")
          '
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Pre-flight Diagnostics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECOND_BRAIN_PLAYLIST_ID: ${{ secrets.SECOND_BRAIN_PLAYLIST_ID }}
          CI: "true"
        run: |
          python -c "
          import os
          key = os.getenv('GEMINI_API_KEY', '')
          pid = os.getenv('SECOND_BRAIN_PLAYLIST_ID', '')
          print('=== PRE-FLIGHT DIAGNOSTICS ===')
          print(f'GEMINI_API_KEY set: {bool(key)} (length: {len(key)})')
          print(f'SECOND_BRAIN_PLAYLIST_ID set: {bool(pid)} (value: {pid})')
          print(f'CI mode: {os.getenv(\"CI\", \"\")}')
          print(f'cookies.txt exists: {os.path.isfile(\"cookies.txt\")}')
          print(f'processed_videos.json exists: {os.path.isfile(\"processed_videos.json\")}')
          if os.path.isfile('processed_videos.json'):
              import json
              with open('processed_videos.json') as f:
                  data = json.load(f)
              print(f'Already processed video IDs: {len(data)}')
              for vid_id in list(data.keys())[:10]:
                  print(f'  - {vid_id}')
          print('=== END DIAGNOSTICS ===')
          "

      - name: Run Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECOND_BRAIN_PLAYLIST_ID: ${{ secrets.SECOND_BRAIN_PLAYLIST_ID }}
          CI: "true"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -u main.py 2>&1 | tee pipeline_output.log
          echo "--- Pipeline exit code: $? ---"

      - name: Show Pipeline Log (Debug)
        if: always()
        run: |
          echo "=== FULL PIPELINE OUTPUT ==="
          cat pipeline_output.log || echo "No pipeline log found"
          echo "=== END OUTPUT ==="

      - name: Commit and Push Changes (Notes & Index)
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/ json/ index.json processed_videos.json logs/ || true
          if git diff --staged --quiet; then
            echo "No new notes to commit."
          else
            git commit -m "📚 Cloud ingest: new notes [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
