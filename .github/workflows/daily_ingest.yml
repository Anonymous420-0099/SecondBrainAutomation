name: Daily YouTube Ingestion

on:
  schedule:
    # Runs daily at 00:00 UTC (runs automatically in the cloud, laptop can be OFF)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to click "Run workflow" manually from GitHub anytime

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Cookies (if provided)
        shell: bash
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt restored from secret."
          else
            echo "No YOUTUBE_COOKIES secret found. Proceeding with playlist ingestion."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECOND_BRAIN_PLAYLIST_ID: ${{ secrets.SECOND_BRAIN_PLAYLIST_ID }}
          CI: "true"
        run: |
          python main.py

      - name: Commit and Push Changes (Notes & Index)
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/ json/ index.json processed_videos.json || true
          if git diff --staged --quiet; then
            echo "No new notes to commit."
          else
            git commit -m "📚 Cloud ingest: new notes [skip ci]"
            git push
          fi
